<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <style type="text/css"><![CDATA[
      .brand-blue { fill: #2C5FC2; }
      .brand-dark { fill: #37332B; }
      .brand-gray { fill: #7B8A98; }
      .title { font-family: 'Poppins', Arial, sans-serif; font-weight: 600; font-size:48px; }
    ]]></style>
  </defs>

  <!-- Simple house + building mark -->
  <g id="mark" transform="translate(24,24)">
    <!-- roof -->
    <polygon class="brand-blue" points="40,0 90,40 0,40" />
    <!-- building body -->
    <rect x="8" y="40" width="64" height="88" rx="6" ry="6" class="brand-blue" opacity="0.95" />
    <!-- windows -->
    <rect x="18" y="54" width="16" height="16" rx="2" ry="2" fill="#E1E3E5" />
    <rect x="40" y="54" width="16" height="16" rx="2" ry="2" fill="#E1E3E5" />
    <rect x="18" y="76" width="16" height="16" rx="2" ry="2" fill="#E1E3E5" />
    <rect x="40" y="76" width="16" height="16" rx="2" ry="2" fill="#E1E3E5" />
    <!-- door -->
    <rect x="30" y="100" width="12" height="28" rx="2" ry="2" fill="#37332B" />
  </g>

  <!-- Brand name -->
  <text x="140" y="96" class="title brand-dark">Loko Immeuble</text>

  <!-- Optional tagline (hidden by default) -->
  <text x="140" y="132" font-family="Poppins, Arial, sans-serif" font-size="14" fill="#6C6C6B" opacity="0.9">Location simplifiée — locataires et propriétaires</text>
</svg>
