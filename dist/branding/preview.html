<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Loko Immeuble — Branding Preview</title>
    <style>
      body{font-family:Arial,Helvetica,sans-serif;padding:24px;background:#f6f7fb}
      h1{color:#0b4fa3}
      .grid{display:flex;flex-wrap:wrap;gap:12px}
      .card{background:#fff;border-radius:8px;padding:8px;box-shadow:0 1px 4px rgba(0,0,0,.08);width:220px}
      img{max-width:100%;height:auto;border-radius:6px}
      .meta{font-size:12px;color:#444;margin-top:6px}
    </style>
  </head>
  <body>
    <h1>Loko Immeuble — Branding Preview</h1>
    <p>Source images extracted from the archive and mockup.</p>
    <div class="grid">
      <!-- show mockup -->
      <div class="card">
        <strong>Mockup / styleboard</strong>
        <img src="source/maket.jpeg" alt="mockup" />
        <div class="meta">source/maket.jpeg</div>
      </div>

      <!-- list logo photos -->
      <!-- images are in source/loko logo/ -->
      <div class="card">
        <strong>Logo folder (preview)</strong>
        <div class="meta">source/loko logo/</div>
      </div>
    </div>

    <p style="margin-top:18px;color:#666">Open the `dist/branding/source` folder to view all extracted images.</p>
  </body>
</html>
