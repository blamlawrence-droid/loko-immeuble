name: Android CI - Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK commandline tools
        run: |
          set -e
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sSfL "https://dl.google.com/android/repository/commandlinetools-linux-114.0.0_latest.zip" -o cmdline.zip
          unzip -q cmdline.zip
          mv cmdline-tools latest || true
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Show Java and Gradle
        run: java -version || true

      - name: Build APK (use wrapper if present)
        run: |
          set -e
          cd android || true
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            # fallback to system gradle if available
            if command -v gradle >/dev/null 2>&1; then
              gradle assembleDebug
            else
              echo "No gradle wrapper and no system gradle available. Attempting to use Gradle wrapper via Gradle distribution..."
              # try to download gradle and run wrapper (best-effort)
              curl -sSfL https://services.gradle.org/distributions/gradle-8.3-bin.zip -o /tmp/gradle.zip
              unzip -q /tmp/gradle.zip -d /tmp
              export PATH="/tmp/gradle-8.3/bin:$PATH"
              if command -v gradle >/dev/null 2>&1; then
                gradle wrapper
                ./gradlew assembleDebug
              else
                echo "Gradle not available; cannot build"
                exit 1
              fi
            fi
          fi

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
