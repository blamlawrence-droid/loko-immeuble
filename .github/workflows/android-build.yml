name: Android CI - Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Show Java and Gradle
        run: |
          java -version || true
          gradle -v || true

      - name: Build APK (use repo gradle wrapper)
        run: |
          set -e
          chmod +x ./gradlew || true
          if ./gradlew :app:assembleDebug --no-daemon --warning-mode=all; then
            echo "Build succeeded with repo wrapper"
          else
            echo "Repo wrapper failed — attempting to download Gradle 7.5 and regenerate wrapper"
            curl -sSfL https://services.gradle.org/distributions/gradle-7.5-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            export PATH="/tmp/gradle-7.5/bin:$PATH"
            # generate a wrapper inside the Android project directory
            gradle -p android wrapper --gradle-version 7.5
            chmod +x ./android/gradlew || true
            ./android/gradlew assembleDebug --no-daemon --warning-mode=all
          fi

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
